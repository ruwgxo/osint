      - type: prose
        text: >-
          Regulatory compliance analysis examines legal adherence while understanding compliance patterns
          and regulatory intelligence. Anti-money laundering analysis examines suspicious transaction
          detection while understanding financial crime patterns and compliance intelligence. Know-your-customer
          analysis examines identity verification while understanding regulatory compliance and customer
