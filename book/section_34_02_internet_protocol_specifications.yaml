        text: IPv6 Address Format
      - type: list
        style: bullet
        items:
          - 'Length: 128 bits (16 bytes)'
          - 'Notation: 8 groups of 4 hexadecimal digits'
          - 'Example: 2001:0db8:85a3:0000:0000:8a2e:0370:7334'
          - 'Compressed: 2001:db8:85a3::8a2e:370:7334'
      - type: heading
        level: 3
        text: IPv6 Address Types
      - type: list
        style: bullet
        items:
          - 'Global Unicast: 2000::/3'
          - 'Link-Local: FE80::/10'
          - 'Unique Local: FC00::/7'
          - 'Multicast: FF00::/8'
          - 'Loopback: ::1/128'
          - 'Unspecified: ::/128'
      - type: heading
        level: 3
        text: IPv6 Special Addresses
      - type: list
        style: bullet
        items:
          - '6to4: 2002::/16 (IPv6 over IPv4 tunneling)'
          - 'Teredo: 2001::/32 (NAT traversal)'
          - 'Documentation: 2001:DB8::/32'
